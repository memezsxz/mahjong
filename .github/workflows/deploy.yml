name: Deploy to GitHub Pages

on:
  push:
    branches: [no-nx]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build -- --base-href "/mahjong/"
      - run: npm run docs
      - run: |
          cat > ./dist/mahjong/browser/404.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <script>
                const path = window.location.pathname;
                if (!path.startsWith('/mahjong/docs')) {
                  sessionStorage.redirect = window.location.href;
                  window.location.replace('/mahjong/');
                }
              </script>
            </head>
            <body></body>
          </html>
          EOF
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/mahjong/browser

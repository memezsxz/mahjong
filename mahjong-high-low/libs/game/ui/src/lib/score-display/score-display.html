<div class="flex flex-col items-center gap-1">
  <span class="font-mono text-[0.52rem] tracking-[0.22em] uppercase text-c-muted">SCORE</span>
  <div class="flex items-baseline gap-1.5">
    <span class="font-mono text-3xl font-bold leading-none text-c-indigo">{{ score() | number }}</span>
    @if (winStreak() > 1) {
      <span class="font-mono text-sm font-bold leading-none text-c-pink">×{{ winStreak() }}</span>
    }
  </div>
</div>

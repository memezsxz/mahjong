<div
  class="absolute inset-0 bg-c-bg/85 backdrop-blur-sm flex items-center justify-center z-10"
  (click)="resumed.emit()"
>
  <div
    class="bg-c-surface border border-c-indigo/10 px-8 py-10 w-72 flex flex-col gap-7"
    (click)="$event.stopPropagation()"
  >
    <span class="font-mono text-sm font-bold tracking-[0.3em] text-c-indigo text-center">PAUSED</span>

    <div class="flex flex-col gap-2.5">
      <p-button
        label="Resume"
        icon="pi pi-play"
        styleClass="pm-btn pm-btn--primary"
        (onClick)="resumed.emit()"
      />
      <p-button
        label="Settings"
        icon="pi pi-cog"
        styleClass="pm-btn pm-btn--secondary"
        severity="secondary"
        (onClick)="settingsOpened.emit()"
      />
      <p-button
        label="Exit Game"
        icon="pi pi-sign-out"
        styleClass="pm-btn pm-btn--danger"
        severity="danger"
        (onClick)="exited.emit()"
      />
    </div>
  </div>
</div>

<div class="flex gap-2">
  @for (t of hand().tiles; track t.id; let i = $index) {
    <lib-tile [tile]="t" [showValue]="showTileValue()" [faceDown]="!showHandTiles()" [tileIndex]="i"></lib-tile>
  }
</div>
@if (showFullHandValue()) {
  <span class="font-mono text-[0.62rem] font-bold tracking-[0.15em] text-c-indigo uppercase">
    Total · {{ hand().total }}
  </span>
}

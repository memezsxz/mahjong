<div
  class="fixed inset-0 bg-c-bg/60 backdrop-blur-sm flex items-stretch justify-end z-20"
  tabindex="0"
  (click)="$event.target === $event.currentTarget && closed.emit()"
  (keydown.enter)="closed.emit()"
  (keydown.space)="closed.emit()"
  (keydown.escape)="closed.emit()"
>
  <div
    class="bg-c-surface border-l border-c-indigo/10 w-full sm:w-80 lg:w-96 h-dvh max-h-dvh flex flex-col overflow-y-auto"
  >
    <!-- Header -->
    <div class="shrink-0 flex justify-between items-center px-6 py-5 border-b border-c-indigo/10">
      <span class="font-mono text-[0.75rem] font-bold tracking-[0.25em] text-c-indigo"
        >SETTINGS</span
      >
      <p-button
        icon="pi pi-times"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        styleClass="sp-close"
        (onClick)="closed.emit()"
      />
    </div>

    <!-- Hand Size -->
    <div class="flex items-center justify-between gap-4 px-6 py-4">
      <div class="flex flex-col gap-0.5">
        <span class="text-sm font-semibold text-c-text">Hand Size</span>
        <span class="font-mono text-[0.55rem] text-c-muted tracking-[0.05em]">Tiles per hand</span>
      </div>
      <div class="flex gap-1">
        @for (n of handSizeOptions; track n) {
          <button
            class="w-9 h-9 border font-mono text-sm font-bold transition-all duration-100"
            [class]="
              inGame()
                ? 'cursor-not-allowed opacity-40 bg-transparent border-c-indigo/10 text-c-muted'
                : settings().handSize === n
                  ? 'cursor-pointer bg-c-indigo border-c-indigo text-white'
                  : 'cursor-pointer bg-transparent border-c-indigo/10 text-c-muted hover:border-c-indigo hover:text-c-indigo'
            "
            [disabled]="inGame()"
            (click)="!inGame() && settingsChanged.emit({ handSize: n })"
          >
            {{ n }}
          </button>
        }
      </div>
    </div>

    <div class="h-px bg-c-indigo/10 mx-6"></div>

    <!-- Show Tile Values -->
    <div class="flex items-center justify-between gap-4 px-6 py-4">
      <div class="flex flex-col gap-0.5">
        <span class="text-sm font-semibold text-c-text">Show Tile Values</span>
        <span class="font-mono text-[0.55rem] text-c-muted tracking-[0.05em]"
          >Display current value badge on each tile</span
        >
      </div>
      <button
        class="h-8 px-3 border font-mono text-[0.62rem] font-bold tracking-[0.1em] cursor-pointer min-w-14 transition-all duration-100"
        [class]="
          settings().showTileValues
            ? 'bg-c-green border-c-green text-white'
            : 'bg-transparent border-c-indigo/10 text-c-muted'
        "
        (click)="settingsChanged.emit({ showTileValues: !settings().showTileValues })"
      >
        {{ settings().showTileValues ? 'ON' : 'OFF' }}
      </button>
    </div>

    <div class="h-px bg-c-indigo/10 mx-6"></div>

    <!-- Sound -->
    <div class="flex items-center justify-between gap-4 px-6 py-4">
      <div class="flex flex-col gap-0.5">
        <span class="text-sm font-semibold text-c-text">Sound Effects</span>
        <span class="font-mono text-[0.55rem] text-c-muted tracking-[0.05em]"
          >Play audio on tile reveal and bet</span
        >
      </div>
      <button
        class="h-8 px-3 border font-mono text-[0.62rem] font-bold tracking-[0.1em] cursor-pointer min-w-14 transition-all duration-100"
        [class]="
          settings().soundEnabled
            ? 'bg-c-green border-c-green text-white'
            : 'bg-transparent border-c-indigo/10 text-c-muted'
        "
        (click)="settingsChanged.emit({ soundEnabled: !settings().soundEnabled })"
      >
        {{ settings().soundEnabled ? 'ON' : 'OFF' }}
      </button>
    </div>

    <div class="h-px bg-c-indigo/10 mx-6"></div>

    <!-- Reveal Animations -->
    <div class="flex items-center justify-between gap-4 px-6 py-4">
      <div class="flex flex-col gap-0.5">
        <span class="text-sm font-semibold text-c-text">Reveal Animations</span>
        <span class="font-mono text-[0.55rem] text-c-muted tracking-[0.05em]"
          >Card reveal and total-to-score animation</span
        >
      </div>
      <button
        class="h-8 px-3 border font-mono text-[0.62rem] font-bold tracking-[0.1em] cursor-pointer min-w-14 transition-all duration-100"
        [class]="
          settings().animationsEnabled
            ? 'bg-c-green border-c-green text-white'
            : 'bg-transparent border-c-indigo/10 text-c-muted'
        "
        (click)="settingsChanged.emit({ animationsEnabled: !settings().animationsEnabled })"
      >
        {{ settings().animationsEnabled ? 'ON' : 'OFF' }}
      </button>
    </div>

    <!-- DO NOT DELETE: Music toggle - kept for when background music is re-enabled -->
    <!--
    <div class="h-px bg-c-indigo/10 mx-6"></div>

    <div class="flex items-center justify-between gap-4 px-6 py-4">
      <div class="flex flex-col gap-0.5">
        <span class="text-sm font-semibold text-c-text">Music</span>
        <span class="font-mono text-[0.55rem] text-c-muted tracking-[0.05em]">Background music during play</span>
      </div>
      <button
        class="h-8 px-3 border font-mono text-[0.62rem] font-bold tracking-[0.1em] cursor-pointer min-w-14 transition-all duration-100"
        [class]="settings().musicEnabled
          ? 'bg-c-green border-c-green text-white'
          : 'bg-transparent border-c-indigo/10 text-c-muted'"
        (click)="settingsChanged.emit({ musicEnabled: !settings().musicEnabled })"
      >{{ settings().musicEnabled ? 'ON' : 'OFF' }}</button>
    </div>
    -->
  </div>
</div>
